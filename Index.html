
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fable Rise MC | Gold Shop</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #100d19;
  color: white;
}
header {
  padding: 22px;
  background: #191326;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #51347b;
}
.logo { color: #bd8aff; font-weight: bold; }
.hero {
  text-align: center;
  padding: 65px 15px;
  background: linear-gradient(135deg,#25133e,#100d19);
}
.hero h1 {
  font-size: 38px;
  color: #c79aff;
}
.hero p { color: #c9bddb; }
.container { padding: 25px 16px; max-width: 900px; margin: auto; }
.packages {
  display: grid;
  grid-template-columns: repeat(2,1fr);
  gap: 15px;
}
.package {
  background: #21182f;
  border: 1px solid #68449a;
  border-radius: 14px;
  padding: 22px 10px;
  text-align: center;
}
.coin { font-size: 35px; }
.package h3 { color: #d2aaff; }
.price { color: #d8c7ee; }
button {
  background: #8b50ce;
  color: white;
  border: 0;
  padding: 12px 22px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}
footer {
  text-align: center;
  padding: 25px;
  color: #9385a7;
}
</style>
</head>
<body>
<header>
  <div class="logo">FABLE RISE MC</div>
  <div>GOLD SHOP</div>
</header>

<section class="hero">
  <h1>GOLD STORE</h1>
  <p>Upgrade Your Adventure</p>
  <p>Welcome to Fable Rise MC</p>
</section>

<main class="container">
  <h2>Gold Packages</h2>
  <div class="packages">
    <div class="package">
      <div class="coin">🪙</div>
      <h3>500 Gold</h3>
      <p class="price">Starter Pack</p>
      <button onclick="alert('Coming Soon!')">Choose</button>
    </div>
    <div class="package">
      <div class="coin">🪙</div>
      <h3>1000 Gold</h3>
      <p class="price">Silver Pack</p>
      <button onclick="alert('Coming Soon!')">Choose</button>
    </div>
    <div class="package">
      <div class="coin">💰</div>
      <h3>2500 Gold</h3>
      <p class="price">Gold Pack</p>
      <button onclick="alert('Coming Soon!')">Choose</button>
    </div>
    <div class="package">
      <div class="coin">💎</div>
      <h3>5000 Gold</h3>
      <p class="price">Diamond Pack</p>
      <button onclick="alert('Coming Soon!')">Choose</button>
    </div>
  </div>
</main>

<footer>
  © 2026 Fable Rise MC
</footer>
</body>
  </html>
